<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EDHPlay Lens</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header id="top" class="top"></header>
    <div id="pinned" class="pinned"></div>
    <main id="main" class="main"></main>
    <section id="settings" class="settings" hidden aria-label="Settings">
      <span class="settings-title">Settings</span>
      <label for="workbench" class="field-label">Workbench address</label>
      <input id="workbench" type="url" placeholder="http://localhost:3200" />
      <div class="row">
        <button id="save" type="button" class="btn">Save</button>
        <button id="retry" type="button" class="btn">Retry now</button>
      </div>
      <p id="error" class="error"></p>
      <p class="muted small">Games are stored by the Workbench in edhplay-data/. Playtests are kept apart from real games.</p>
    </section>
    <footer class="foot">
      <span id="footline" class="footline"></span>
      <button id="settings-toggle" type="button" class="link-btn" aria-controls="settings" aria-expanded="false">Settings</button>
    </footer>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
